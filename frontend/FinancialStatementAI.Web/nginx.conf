server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy /api to the api container (see docker-compose.yml) — the same relative-path
    # convention the Angular dev server's proxy config uses, so no environment-specific base URL
    # needs to be baked into the built bundle.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # Angular client-side routing — any path not matching a real static file falls back to
    # index.html so the Angular router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<h2 mat-dialog-title>{{ isEdit ? 'Edit Category' : 'Add Category' }}</h2>

<mat-dialog-content class="form-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="name" name="name" maxlength="100" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput [(ngModel)]="description" name="description" rows="3" maxlength="500"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!isValid" (click)="save()">
    {{ isEdit ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>

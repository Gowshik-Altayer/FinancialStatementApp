<app-page-header title="Transactions" subtitle="Every transaction across all of your statements — search, filter, and correct as needed.">
</app-page-header>

@if (summary(); as s) {
  <div class="kpi-row">
    <app-kpi-card label="Total Transactions" [value]="s.totalCount" icon="receipt_long" tone="info" />
    <app-kpi-card label="High Confidence" [value]="s.highConfidenceCount" icon="verified" tone="success" />
    <app-kpi-card label="Needing Review" [value]="s.needingReviewCount" icon="fact_check" [tone]="s.needingReviewCount > 0 ? 'warning' : 'success'" />
    <app-kpi-card label="Corrected" [value]="s.correctedCount" icon="edit_note" tone="neutral" />
  </div>
}

<div class="search-row">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
    <mat-label>Search</mat-label>
    <input matInput placeholder="Search description or merchant…" [ngModel]="search()" (ngModelChange)="search.set($event)" />
  </mat-form-field>

  @if (hasActiveFilters()) {
    <button mat-button type="button" (click)="clearFilters()">Clear filters</button>
  }
</div>

<p class="filter-hint">Use the column headers below to filter by statement, date, amount, type, category, or confidence.</p>

@if (isLoading()) {
  <app-skeleton variant="table" [count]="10" />
} @else if (loadError()) {
  <app-error-state message="We couldn't load your transactions." (retry)="retry()" />
} @else if (transactions().length === 0) {
  <app-empty-state icon="receipt_long" message="No transactions match these filters." [actionLabel]="hasActiveFilters() ? 'Clear filters' : undefined" (action)="clearFilters()" />
} @else {
  <app-data-grid
    [columnDefs]="columnDefs"
    [rowData]="transactions()"
    [getRowId]="getRowId"
    [rowClassRules]="rowClassRules"
    [pagination]="true"
    [paginationPageSize]="20"
    (cellValueChanged)="onCellValueChanged($event)"
    (gridApiReady)="onGridApiReady($event)"
    (filterChanged)="onGridFilterChanged($event)"
  />
}

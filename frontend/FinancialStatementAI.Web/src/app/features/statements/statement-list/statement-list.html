<app-page-header title="Statements" subtitle="Every uploaded bank statement and where it stands in the processing pipeline.">
  <a mat-flat-button color="primary" routerLink="/statements/upload">
    <mat-icon>upload</mat-icon>
    Upload statement
  </a>
</app-page-header>

<div class="search-row">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
    <mat-label>Search</mat-label>
    <input matInput placeholder="File name, provider, account holder…" [ngModel]="search()" (ngModelChange)="search.set($event)" />
  </mat-form-field>

  @if (hasActiveFilters()) {
    <button mat-button type="button" (click)="clearFilters()">Clear filters</button>
  }
</div>

<p class="filter-hint">Use the column headers below to filter by status, reconciliation, dates, and amounts.</p>

@if (isLoading()) {
  <app-skeleton variant="table" [count]="8" />
} @else if (loadError()) {
  <app-error-state message="We couldn't load your statements." (retry)="retry()" />
} @else if (statements().length === 0) {
  <app-empty-state icon="description" message="No statements match these filters." />
} @else {
  <app-data-grid
    [columnDefs]="columnDefs"
    [rowData]="statements()"
    [getRowId]="getRowId"
    [pagination]="true"
    [paginationPageSize]="20"
    (gridApiReady)="onGridApiReady($event)"
    (filterChanged)="onGridFilterChanged($event)"
  />
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET build & test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FinancialStatementAI.sln

      - name: Build
        run: dotnet build FinancialStatementAI.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FinancialStatementAI.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/test-results.trx'

  frontend:
    name: Frontend (Angular build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/FinancialStatementAI.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/FinancialStatementAI.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Build production bundle
        run: npx ng build --configuration production
